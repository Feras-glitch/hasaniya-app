# بناء تطبيق أندرويد للمنظومة الحسنية
# - يشغّل اختبارات المحتوى والمنطق أولاً، ولا يبني إن فشل أحدها.
# - ينسخ web/ إلى داخل تطبيق أندرويد (لا تُحفظ نسخة مكررة في المستودع).
# - يوقّع النسخة بالمفتاح الثابت من الأسرار؛ وإن لم تُضَف الأسرار بعد يبني نسخة تجريبية ويحذّر.
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: node web/tests/run-all.js

      - name: Copy web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r web/index.html web/sw.js web/manifest.json web/css web/js web/img android/app/src/main/assets/www/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Restore signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.HASANIYA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hasaniya.jks"
            echo "path=$RUNNER_TEMP/hasaniya.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::لم تُضف أسرار التوقيع بعد؛ ستُبنى نسخة تجريبية لا تُثبَّت فوق النسخ اللاحقة. انظر SIGNING-AR.md"
          fi

      - name: Build signed release APK
        if: steps.key.outputs.path != ''
        working-directory: android
        env:
          HASANIYA_KEYSTORE: ${{ steps.key.outputs.path }}
          HASANIYA_KEYSTORE_PASSWORD: ${{ secrets.HASANIYA_KEYSTORE_PASSWORD }}
          HASANIYA_KEY_ALIAS: ${{ secrets.HASANIYA_KEY_ALIAS }}
          HASANIYA_KEY_PASSWORD: ${{ secrets.HASANIYA_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/hasaniya.apk"

      - name: Build debug APK (no signing key yet)
        if: steps.key.outputs.path == ''
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/hasaniya-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: hasaniya-apk
          path: hasaniya*.apk
