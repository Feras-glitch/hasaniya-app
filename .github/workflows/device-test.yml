# اختبار التطبيق على هاتف أندرويد افتراضي بعد كل رفع:
# تثبيت وفتح، زر الرجوع، تدوير، ميكروفون، مشاركة، طباعة، اختيار ملفات، الوضع الليلي،
# العمل دون إنترنت بعد إغلاق قسري، وتثبيت تحديث فوق نسخة سابقة دون فقد التقدم.
# النتيجة في ملخص التشغيل، والصور في Artifacts باسم device-screens.
name: Device test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Copy web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r web/index.html web/sw.js web/manifest.json web/css web/js web/img android/app/src/main/assets/www/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Restore signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.HASANIYA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hasaniya.jks"
            echo "path=$RUNNER_TEMP/hasaniya.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build two test versions (current, and current + 1)
        working-directory: android
        env:
          HASANIYA_KEYSTORE: ${{ steps.key.outputs.path }}
          HASANIYA_KEYSTORE_PASSWORD: ${{ secrets.HASANIYA_KEYSTORE_PASSWORD }}
          HASANIYA_KEY_ALIAS: ${{ secrets.HASANIYA_KEY_ALIAS }}
          HASANIYA_KEY_PASSWORD: ${{ secrets.HASANIYA_KEY_PASSWORD }}
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/v1.apk"
          # النسخة الثانية: رقمها أعلى بواحد (تعديل مؤقت داخل خادم الاختبار فقط، لا يُرفع)
          sed -i -E 's/versionCode ([0-9]+)/versionCode \1 + 1/' app/build.gradle
          grep -n "versionCode" app/build.gradle
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/v2.apk"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          echo "::notice::v1: $("$AAPT" dump badging "$RUNNER_TEMP/v1.apk" | head -1)"
          echo "::notice::v2: $("$AAPT" dump badging "$RUNNER_TEMP/v2.apk" | head -1)"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install test tools
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --no-save --no-package-lock playwright@1.49.1

      - name: Run tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_V1: ${{ runner.temp }}/v1.apk
          APK_V2: ${{ runner.temp }}/v2.apk
          OUT_DIR: device-results
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          script: timeout 1200 node web/tests/device/emulator-test.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-screens
          path: device-results/
