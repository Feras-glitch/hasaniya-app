plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hasaniya.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.hasaniya.app"
        minSdk 26
        targetSdk 34
        versionCode 114
        versionName "114.0"
    }

    /* التوقيع: المفتاح يأتي من أسرار GitHub (انظر docs/owner/SIGNING-AR.md)،
       ولا يُحفظ في المستودع أبداً. المفتاح نفسه في كل نسخة release، فتُثبَّت كل نسخة فوق السابقة دون فقد البيانات. */
    def ks = System.getenv("HASANIYA_KEYSTORE")
    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv("HASANIYA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("HASANIYA_KEY_ALIAS")
                keyPassword System.getenv("HASANIYA_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
        // نسخة الاختبار (debuggable) بمفتاح debug الافتراضي، لا بمفتاح الإنتاج أبداً: نسخة قابلة للفحص
        // موقّعة بمفتاح الإنتاج يمكن تثبيتها فوق نسخة الأهل فتكشف بياناتهم. اختبار «التحديث فوق نسخة مثبّتة»
        // (device-test.yml) يبني نسختيه debug في الخادم نفسه، فكلتاهما بمفتاح debug نفسه.
        debug {
            signingConfig signingConfigs.debug
        }
    }



    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/* v114: ملفات التطبيق تُنسخ من web/ قبل كل بناء، فيعمل البناء المحلي (Android Studio أو ./gradlew)
   كما يعمل في GitHub (كان النسخ في ملف البناء الآلي وحده، فيبني Android Studio تطبيقاً فارغاً).
   القائمة نفسها التي ينسخها البناء الآلي. */
def webDir = rootProject.file("../web")
tasks.register("copyWebAssets", Copy) {
    from(webDir) {
        include "index.html", "sw.js", "manifest.json", "css/**", "js/**", "img/**", "fonts/**", "audio/**"
    }
    into "src/main/assets/www"
}
tasks.matching { it.name == "preBuild" }.configureEach { dependsOn "copyWebAssets" }

