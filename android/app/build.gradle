plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hasaniya.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.hasaniya.app"
        minSdk 26
        targetSdk 34
        versionCode 106
        versionName "106.0"
    }

    /* التوقيع: المفتاح يأتي من أسرار GitHub (انظر SIGNING-AR.md في جذر المستودع)،
       ولا يُحفظ في المستودع أبداً. المفتاح نفسه في كل نسخة release، فتُثبَّت كل نسخة فوق السابقة دون فقد البيانات. */
    def ks = System.getenv("HASANIYA_KEYSTORE")
    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv("HASANIYA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("HASANIYA_KEY_ALIAS")
                keyPassword System.getenv("HASANIYA_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
        // نسخة الاختبار (debuggable) بمفتاح debug الافتراضي، لا بمفتاح الإنتاج أبداً: نسخة قابلة للفحص
        // موقّعة بمفتاح الإنتاج يمكن تثبيتها فوق نسخة الأهل فتكشف بياناتهم. اختبار «التحديث فوق نسخة مثبّتة»
        // (device-test.yml) يبني نسختيه debug في الخادم نفسه، فكلتاهما بمفتاح debug نفسه.
        debug {
            signingConfig signingConfigs.debug
        }
    }



    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
